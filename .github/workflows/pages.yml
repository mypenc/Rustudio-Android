name: Web build (GitHub Pages)

# Builds the wasm32 editor with trunk and publishes it to the gh-pages branch.
# Serves at https://mypenc.github.io/Rustudio-Android/

on:
  push:
    branches: [web-port]
  workflow_dispatch:

permissions:
  contents: write

env:
  WASI_SDK_VERSION: "25"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: pages
      - name: Install wasi-sdk (libc headers for the C and C++ deps)
        run: |
          curl -sSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" | sudo tar xz -C /opt
          sudo mv /opt/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux /opt/wasi-sdk
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Release build log (kept on ci-logs)
        continue-on-error: true
        env:
          CC_wasm32_unknown_unknown: /opt/wasi-sdk/bin/clang
          CXX_wasm32_unknown_unknown: /opt/wasi-sdk/bin/clang++
          AR_wasm32_unknown_unknown: /opt/wasi-sdk/bin/llvm-ar
          CFLAGS_wasm32_unknown_unknown: --target=wasm32-wasip1 --sysroot=/opt/wasi-sdk/share/wasi-sysroot
          CXXFLAGS_wasm32_unknown_unknown: --target=wasm32-wasip1 --sysroot=/opt/wasi-sdk/share/wasi-sysroot
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
        run: |
          mkdir -p pages-log
          cargo build --release --target wasm32-unknown-unknown --bin rustudio --message-format short > pages-log/build.log 2>&1
          echo "exit=$?" >> pages-log/build.log
          tail -n 60 pages-log/build.log
      - name: Publish release build log to ci-logs
        if: always()
        run: |
          cd pages-log && git init -q -b ci-logs && git config user.name mypenc && git config user.email 338947253+mypenc@users.noreply.github.com
          echo "run ${{ github.run_id }} @ ${{ github.sha }}" > RUN
          git add -A && git commit -q -m "pages build log ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs
      - name: trunk build (release)
        env:
          CC_wasm32_unknown_unknown: /opt/wasi-sdk/bin/clang
          CXX_wasm32_unknown_unknown: /opt/wasi-sdk/bin/clang++
          AR_wasm32_unknown_unknown: /opt/wasi-sdk/bin/llvm-ar
          CFLAGS_wasm32_unknown_unknown: --target=wasm32-wasip1 --sysroot=/opt/wasi-sdk/share/wasi-sysroot
          CXXFLAGS_wasm32_unknown_unknown: --target=wasm32-wasip1 --sysroot=/opt/wasi-sdk/share/wasi-sysroot
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
        run: trunk build --release --public-url /Rustudio-Android/ --dist dist
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
