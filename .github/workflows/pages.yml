name: Web build (GitHub Pages)

# Builds the wasm32 editor with trunk and publishes it to the gh-pages branch.
# Serves at https://mypenc.github.io/Rustudio-Android/

on:
  push:
    branches: [web-port]
  workflow_dispatch:

permissions:
  contents: write

env:
  WASI_SDK_VERSION: "25"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: pages
      - name: Install wasi-sdk (libc headers for the C and C++ deps)
        run: |
          curl -sSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" | sudo tar xz -C /opt
          sudo mv /opt/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux /opt/wasi-sdk
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Release build log (kept on ci-logs)
        continue-on-error: true
        env:
          CC_wasm32_unknown_unknown: /opt/wasi-sdk/bin/clang
          CXX_wasm32_unknown_unknown: /opt/wasi-sdk/bin/clang++
          AR_wasm32_unknown_unknown: /opt/wasi-sdk/bin/llvm-ar
          CFLAGS_wasm32_unknown_unknown: --target=wasm32-wasip1 --sysroot=/opt/wasi-sdk/share/wasi-sysroot -mllvm -wasm-enable-sjlj -mexception-handling
          CXXFLAGS_wasm32_unknown_unknown: --target=wasm32-wasip1 --sysroot=/opt/wasi-sdk/share/wasi-sysroot -mllvm -wasm-enable-sjlj -mexception-handling
          CXXSTDLIB_wasm32_unknown_unknown: c++
          RUSTFLAGS: --cfg getrandom_backend="wasm_js" -L native=/opt/wasi-sdk/share/wasi-sysroot/lib/wasm32-wasip1 -C link-arg=-lc++abi -C link-arg=-lc -C link-arg=-lsetjmp -C link-arg=-lwasi-emulated-process-clocks
        run: |
          mkdir -p pages-log
          cargo build --release --target wasm32-unknown-unknown --bin rustudio > pages-log/full.log 2>&1
          echo "exit=$?" >> pages-log/full.log
          sed 's/\x1b\[[0-9;]*m//g' pages-log/full.log | grep -a -n 'wasm-ld\|rust-lld\|undefined\|error:' | cut -c1-300 | head -300 > pages-log/build.log || true
          sed 's/\x1b\[[0-9;]*m//g' pages-log/full.log | grep -a -A60 'linking with' | cut -c1-1500 | head -120 >> pages-log/build.log || true
          rm pages-log/full.log
          tail -n 40 pages-log/build.log
      - name: Publish release build log to ci-logs
        if: always()
        run: |
          cd pages-log && git init -q -b pages-logs && git config user.name mypenc && git config user.email 338947253+mypenc@users.noreply.github.com
          echo "run ${{ github.run_id }} @ ${{ github.sha }}" > RUN
          git add -A && git commit -q -m "pages build log ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pages-logs
      - name: trunk build (release)
        env:
          CC_wasm32_unknown_unknown: /opt/wasi-sdk/bin/clang
          CXX_wasm32_unknown_unknown: /opt/wasi-sdk/bin/clang++
          AR_wasm32_unknown_unknown: /opt/wasi-sdk/bin/llvm-ar
          CFLAGS_wasm32_unknown_unknown: --target=wasm32-wasip1 --sysroot=/opt/wasi-sdk/share/wasi-sysroot -mllvm -wasm-enable-sjlj -mexception-handling
          CXXFLAGS_wasm32_unknown_unknown: --target=wasm32-wasip1 --sysroot=/opt/wasi-sdk/share/wasi-sysroot -mllvm -wasm-enable-sjlj -mexception-handling
          CXXSTDLIB_wasm32_unknown_unknown: c++
          RUSTFLAGS: --cfg getrandom_backend="wasm_js" -L native=/opt/wasi-sdk/share/wasi-sysroot/lib/wasm32-wasip1 -C link-arg=-lc++abi -C link-arg=-lc -C link-arg=-lsetjmp -C link-arg=-lwasi-emulated-process-clocks
        run: trunk build --release --public-url /Rustudio-Android/ --dist dist
      - name: Run C++ static constructors once (wasm-ld command-model wrappers re-run them per call)
        run: |
          f=$(ls dist/*_bg.wasm)
          python3 tools/wasmfix/patch.py "$f" "$f.new" && mv "$f.new" "$f"
          python3 - "$f" <<'PY'
          import sys, re, glob, hashlib, base64, os
          f = sys.argv[1]; name = os.path.basename(f)
          h = 'sha384-' + base64.b64encode(hashlib.sha384(open(f, 'rb').read()).digest()).decode()
          p = 'dist/index.html'; s = open(p).read()
          s, n = re.subn(r'(href="[^"]*%s"[^>]*integrity=")sha384-[^"]*(")' % re.escape(name), r'\g<1>%s\g<2>' % h, s)
          s = re.sub(r'(integrity=")sha384-[^"]*("[^>]*href="[^"]*%s")' % re.escape(name), r'\g<1>%s\g<2>' % h, s)
          open(p, 'w').write(s); print('integrity refreshed', n)
          PY
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
