name: WASM probe

on:
  push:
    branches: [web-port]
  workflow_dispatch:

permissions:
  contents: write

env:
  WASI_SDK_VERSION: "25"

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [rustudio-core, rustudio-physics, rustudio-render, rustudio-account, rustudio-engine, rustudio-player, rustudio-net, rustudio]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: probe-${{ matrix.crate }}
      - name: Install wasi-sdk (libc / libc++ headers for the C and C++ deps)
        run: |
          curl -sSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" | sudo tar xz -C /opt
          sudo mv /opt/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux /opt/wasi-sdk
          find /opt/wasi-sdk/share/wasi-sysroot/include -maxdepth 1
      - name: cargo check (wasm32-unknown-unknown)
        shell: bash
        env:
          CC_wasm32_unknown_unknown: /opt/wasi-sdk/bin/clang
          CXX_wasm32_unknown_unknown: /opt/wasi-sdk/bin/clang++
          AR_wasm32_unknown_unknown: /opt/wasi-sdk/bin/llvm-ar
          CFLAGS_wasm32_unknown_unknown: --target=wasm32-wasip1 --sysroot=/opt/wasi-sdk/share/wasi-sysroot
          CXXFLAGS_wasm32_unknown_unknown: --target=wasm32-wasip1 --sysroot=/opt/wasi-sdk/share/wasi-sysroot
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
        run: |
          mkdir -p out
          set +e
          cargo check -p ${{ matrix.crate }} --target wasm32-unknown-unknown --keep-going --message-format short > out/${{ matrix.crate }}.log 2>&1
          echo "exit=$?" >> out/${{ matrix.crate }}.log
          tail -n 40 out/${{ matrix.crate }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ matrix.crate }}
          path: out/

  collect:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: logs
          pattern: log-*
          merge-multiple: true
      - name: Publish logs to the ci-logs branch
        run: |
          cd logs
          git init -q -b ci-logs
          git config user.name "mypenc"
          git config user.email "338947253+mypenc@users.noreply.github.com"
          mkdir -p probe && mv *.log probe/ 2>/dev/null || true
          echo "run ${{ github.run_id }} @ ${{ github.sha }}" > probe/RUN
          git add -A && git commit -q -m "probe logs ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs
