[package]
name = "rustudio-net"
description = "Roblox Team Create live-session client for rustudio: matchmaker, join-script parsing, transport, and the CloudEdit DataModel stream"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
web-time = "1"
log = "0.4"
rustudio-account = { path = "../rustudio-account" }
rbx_dom_weak = "4"
rbx_types = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# RbxTransport (QUIC). quinn + rustls (ring provider); the transport seam in
# transport.rs is wired to these once the capture pins ALPN / cert pinning /
# the SessionCrypto-over-TLS layer.
# replicator payloads (schema, initial-stream chunks, instance batches) are zstd frames
zstd = "0.13"
base64 = "0.23"

# Roblox shared/protected string content identifiers use BLAKE2b-128.
blake2 = "0.10"

# LiveScripting atomic updates compare the current source MD5 hex digest.
md-5 = "0.10"

[dev-dependencies]
rbx_binary = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ring = "0.17"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
