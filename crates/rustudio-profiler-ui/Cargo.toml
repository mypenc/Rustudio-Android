[package]
name = "rustudio-profiler-ui"
description = "The profiler window for rustudio (editor and player): frame strip, timeline, tree, counters, GPU and Scripts tabs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustudio-core = { path = "../rustudio-core" }
rustudio-engine = { path = "../rustudio-engine" }
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
log = "0.4"
pollster = "0.4"

# Desktop only: rfd 0.15 has no Android backend (its FileDialog traits
# aren't implemented there). On Android the window exports into the app's
# data folder instead (dialogs.rs).
[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
rfd = "0.15"

[dev-dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }
